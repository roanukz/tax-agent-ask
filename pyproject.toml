[project]
name = "tax-agent-ask"
version = "0.1.0"
description = "Measures how many questions an AI tax intake agent asks and which documents it misses."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "claude-agent-sdk==0.2.175",
    "anthropic==2.3.0",
    "mcp==2.3.0",
    "pydantic==2.14.2",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-socket==0.8.1",
    "mutmut==3.7.0",
    "playwright==1.64.1",
]

[tool.uv]
package = false
no-build = true
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mutmut]
# Mutation testing of the scorer (PRD criterion 7). Run: uv run mutmut run, then uv run mutmut results.
source_paths = ["eval/score.py", "eval/aliases.py"]
also_copy = ["rules/", "eval/__init__.py"]
pytest_add_cli_args_test_selection = ["tests/test_aliases.py", "tests/test_score.py"]
