<?xml version="1.0" encoding="UTF-8"?>
<!--
  Share card for the teardown page. Coordinate space 1200x627; og-image.png is
  rendered from this file at 2x, 2400x1254. Edit here, not there. Render command
  is in the README.

  LAYOUT IS CENTERED ON PURPOSE. LinkedIn's profile Featured section center crops
  to roughly a square, so every element lives inside a 540px wide center column
  (x 330 to 870). Same rule as the sibling repos.

  The illustration is the project's argument in one picture: a client's request
  list built from what changed this year. Three documents are requested, and the
  paperwork for a credit that ended is deliberately not asked for.

  Colors are literal values, since an SVG cannot read a stylesheet, and this file
  fetches nothing. Fonts are a plain system stack.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">

  <rect width="1200" height="627" fill="#10141a"/>

  <!-- ============ the request list ============ -->

  <rect x="430" y="54" width="340" height="226" rx="14" fill="#1b2028" stroke="#3f4653" stroke-width="2"/>

  <rect x="450" y="76" width="44" height="20" rx="5" fill="#163f4c"/>
  <text x="472" y="90.5" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7fbdcd">W-2</text>
  <rect x="506" y="81" width="96" height="9" rx="4.5" fill="#c8ced7"/>
  <text x="750" y="91" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.7" fill="#7cc39a">REQUESTED</text>

  <rect x="450" y="118" width="44" height="20" rx="5" fill="#163f4c"/>
  <text x="472" y="132.5" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7fbdcd">1095-A</text>
  <rect x="506" y="123" width="120" height="9" rx="4.5" fill="#c8ced7"/>
  <text x="750" y="133" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.7" fill="#7cc39a">REQUESTED</text>

  <rect x="450" y="160" width="44" height="20" rx="5" fill="#163f4c"/>
  <text x="472" y="174.5" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7fbdcd">1098-T</text>
  <rect x="506" y="165" width="84" height="9" rx="4.5" fill="#c8ced7"/>
  <text x="750" y="175" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.7" fill="#7cc39a">REQUESTED</text>

  <line x1="450" y1="203" x2="750" y2="203" stroke="#3f4653" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="450" y="226" width="44" height="20" rx="5" fill="#2a303a"/>
  <text x="472" y="240.5" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7d8592">SOLAR</text>
  <rect x="506" y="231" width="80" height="9" rx="4.5" fill="#3f4653"/>
  <line x1="502" y1="235.5" x2="592" y2="235.5" stroke="#d9705a" stroke-width="3" stroke-linecap="round"/>
  <text x="750" y="241" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.7" fill="#d9705a">NOT ASKED</text>

  <!-- ============ the words ============ -->

  <text x="600" y="333" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#4a9bb0">PRODUCT TEARDOWN</text>

  <text x="600" y="400" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f4f6f8">What Should My</text>
  <text x="600" y="452" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f4f6f8">Tax Agent Ask?</text>

  <rect x="545" y="482" width="110" height="5" rx="2.5" fill="#4a9bb0"/>

  <text x="600" y="534" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#c8ced7">Only what this year's return needs: 92% of test runs</text>
  <text x="600" y="568" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#c8ced7">passed, under 1% of documents missed</text>
</svg>
