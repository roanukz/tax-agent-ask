# List prices in USD per million tokens, copied from PRD section 3.
source_url: https://platform.claude.com/docs/en/about-claude/pricing
checked_on: 2026-10-30
batch_discount: 0.5
models:
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_read: 0.01
    # Not in PRD section 3: assumed 1.25 times input. Verify against the pricing page.
    cache_write: 0.125
    # The listed Haiku price applies to prompts up to this many tokens, counting cache
    # reads and writes. Longer prompts are charged at the fallback model's rates as an
    # upper bound until the long-prompt price is checked.
    max_prompt_tokens: 100000
    over_max_prompt_fallback: claude-sonnet-5-5
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.10
    cache_write: 2.50
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_read: 0.20
    cache_write: 5.00
