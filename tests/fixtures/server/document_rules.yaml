# A small rules file for the server tests, independent of rules/document_rules.yaml.
# It mixes statuses on purpose: verified, to_verify, and excluded rules, a
# counted rule of each status, a rule that needs two facts, and one trap of
# each status. verified_by is "fixture" because nobody verified these.

- id: R001
  when:
    all:
    - {fact: w2_employer_count, gte: 1}
  document: Form W-2 from each employer
  count_from: w2_employer_count
  aliases: [W-2, Form W-2]
  client_reason: You were paid wages, so we need the year-end wage statement from each employer.
  source_url: https://www.irs.gov/forms-pubs/about-form-w-2
  source_title: About Form W-2, Wage and Tax Statement
  source_version: guidance
  tax_years: [2026]
  trap: false
  status: verified
  verified_by: fixture
  verified_on: '2026-10-30'

- id: R004
  when:
    all:
    - {fact: interest_income, eq: true}
  document: Form 1099-INT from each payer
  count_from: null
  aliases: [1099-INT]
  client_reason: You earned interest, so we need the year-end interest statement from each payer.
  source_url: https://www.irs.gov/forms-pubs/about-form-1099-int
  source_title: About Form 1099-INT, Interest Income
  source_version: guidance
  tax_years: [2026]
  trap: false
  status: verified
  verified_by: fixture
  verified_on: '2026-10-30'

