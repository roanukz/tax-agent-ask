# Fact keys the intake agent can record: 36 top-level keys plus 3 follow-ups
# (the year and date keys), which are asked only when their parent is yes.
#
# type: bool | int | enum | date (ISO YYYY-MM-DD)
# determinable_from_prior_year: true when last year's summary has a field that
#   answers it, named by prior_year_field (evidence prior_year:<field>). Any
#   other fact can be carried over only as prior_year:documents_on_file.<rule_id>,
#   for a rule on last year's file, not a trap, whose condition or count reads
#   it; a fact only traps read can't be carried over. Carried facts are leads:
#   they can change, and scoring reports stale carryovers. agent/hooks.py works
#   out which field holds which fact from this file and document_rules.yaml.
# A fact that is never recorded counts as false for bool, 0 for int, and
# unknown (null) for enum and date.

- key: filing_status
  type: enum
  values: [single, married_joint, married_separate, head_of_household, qualifying_surviving_spouse]
  topic: household
  plain_question_hint: "Are you filing the same way as last year: single, married filing together, or something else?"
  determinable_from_prior_year: true
  prior_year_field: filing_status
  asked_if: null

